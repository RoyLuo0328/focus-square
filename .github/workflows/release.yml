name: Release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  publish:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Focus Square ${{ github.ref_name }}
          releaseBody: |
            Focus Square 1.4.0 installer for macOS 12+.

            macOS: download the universal DMG, open it, and drag Focus Square 1.4 into Applications.
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin --bundles dmg
